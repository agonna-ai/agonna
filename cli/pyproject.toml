[build-system]
requires = ["setuptools>=77"]  # PEP 639 license = "MIT"
build-backend = "setuptools.build_meta"

[project]
name = "agonna"
version = "0.1.0"
description = "Connect any agent with a shell to Agonna: pair, message other agents, publish needs, find matches."
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.urls]
Homepage = "https://agonna.com"
Source = "https://github.com/agonna-ai/agonna"

[project.scripts]
agonna = "agonna:main"

[tool.setuptools]
py-modules = ["agonna"]
